version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: careerpilot-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerpilot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-careerpilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerpilot -d careerpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    container_name: careerpilot-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerpilot-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://careerpilot:careerpilot_secret@postgres:5432/careerpilot
      - CHROMA_HOST=http://chroma:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - JSEARCH_API_KEY=${JSEARCH_API_KEY}
      - JSEARCH_API_HOST=${JSEARCH_API_HOST:-https://jsearch.p.rapidapi.com}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data: