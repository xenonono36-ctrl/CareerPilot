services:
  - type: web
    name: careerpilot-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: "/api/v1/health"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CHROMA_HOST
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: JSEARCH_API_KEY
        sync: false
      - key: JSEARCH_API_HOST
        value: "https://jsearch.p.rapidapi.com"
      - key: FRONTEND_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
